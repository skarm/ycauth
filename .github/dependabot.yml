version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /s3iam
    schedule:
      interval: weekly
    ignore:
      # Released in lockstep with the root module, not by Dependabot.
      - dependency-name: github.com/skarm/ycauth
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /pgxiam
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/skarm/ycauth
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
