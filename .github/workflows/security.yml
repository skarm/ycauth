name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "s3iam", "pgxiam"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Resolve the root module from the working tree
        if: matrix.module != '.'
        run: go mod edit -replace github.com/skarm/ycauth=..
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
